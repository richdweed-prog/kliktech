<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlicTech Sem Fronteiras — Área do cliente</title><style>:root{--bg:#080b16;--panel:#101a31;--line:#253452;--ink:#eef4ff;--muted:#8190ad;--green:#8dff24;--red:#ff7272}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#15335a55,transparent 35%),var(--bg);color:var(--ink);font:14px Arial}.wrap{max-width:1180px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:20px;font-weight:800}.brand b{background:var(--green);color:#071006;padding:7px 9px;border-radius:7px;margin-right:8px}.top a{color:var(--muted)}.card{background:linear-gradient(145deg,#101a31,#0c1426);border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:18px}.form{display:grid;gap:10px;max-width:430px}.form input,.form button{padding:13px;background:#080b16;border:1px solid #344567;color:var(--ink);border-radius:5px}.form button,.primary{background:var(--green);color:#071006;font-weight:800}.dash{display:none}.header{display:flex;align-items:center;justify-content:space-between;gap:15px}.header h1{font-size:35px;letter-spacing:-.07em;margin:8px 0}.header p{color:var(--muted)}.balance{font-size:25px;color:var(--green);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat small{color:var(--muted);font-size:10px;text-transform:uppercase}.stat h2{margin-bottom:0}.purchase{border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:12px;background:#0d162a}.purchase-head{display:flex;justify-content:space-between;gap:10px}.purchase-head b{font-size:16px}.approved{color:var(--green);font-size:10px;font-weight:800}.meta{display:flex;flex-wrap:wrap;gap:15px;color:var(--muted);font-size:11px;margin:12px 0}.meta strong{color:var(--ink)}details{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}summary{cursor:pointer;color:var(--green);font-weight:800;font-size:12px}.activation{display:grid;grid-template-columns:180px 1fr;gap:18px;margin-top:14px}.photo{width:100%;min-height:125px;object-fit:cover;background:#080b16;border:1px solid var(--line);border-radius:7px}.codes{background:#080b16;color:var(--green);padding:13px;border-radius:6px;font:11px/1.7 monospace;word-break:break-all}.guide{margin-top:17px;border-top:1px solid var(--line);padding-top:15px}.guide h3{font-size:15px;margin:0 0 12px}.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:7px;padding:13px}.step b{display:block;color:var(--green);margin-bottom:8px}.step span{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:6px}.notice{background:#2e2714;color:#ffdd7d;border:1px solid #715b23;padding:13px;border-radius:6px;font-size:11px;line-height:1.5;margin-top:12px}.logout{padding:9px 12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px}@media(max-width:700px){.grid,.steps{grid-template-columns:1fr}.header{display:block}.activation{grid-template-columns:1fr}.top{display:block}.top a{display:inline-block;margin-top:12px}}</style><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/klicktech-3d.css">
</head><body><main class="wrap"><header class="top"><div class="brand"><b>K</b>KlicTech Sem Fronteiras</div><div><a href="/">Voltar para loja</a></div></header><section id="auth" class="card"><h1>Minha conta</h1><p>Entre para consultar seu saldo, histórico e ativações.</p><div class="form"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button onclick="login()">Entrar →</button></div><p id="error"></p></section><section id="dash" class="dash"><div class="card header"><div><small>ÁREA PRIVADA</small><h1 id="name"></h1><p>Seu histórico e seus eSIMs ficam aqui.</p></div><div><div class="balance" id="balance"></div><button class="logout" onclick="logout()">Sair</button></div></div><div class="grid"><div class="card stat"><small>Compras aprovadas</small><h2 id="count">0</h2></div><div class="card stat"><small>Entrega</small><h2 style="color:var(--green)">Imediata</h2></div><div class="card stat"><small>Próximo passo</small><h2>Instalar</h2></div></div><div class="card"><h2>Histórico e ativações</h2><div id="list"></div></div></section></main><script>async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok){error.textContent=d.error;return}if(d.is_admin){location.href='/ademiroputo/dashboard';return}load()}function money(v){return 'R$ '+Number(v).toFixed(2).replace('.',',')}function render(x){let g=x.setup_guide;return `<article class="purchase"><div class="purchase-head"><b>${x.plan}</b><span class="approved">APROVADA · ENTREGA LIBERADA</span></div><div class="meta"><span>Valor: <strong>${money(x.price)}</strong></span><span>${x.date}</span></div><details open><summary>Ver eSIM e configuração</summary><div class="activation">${x.photo_url?`<img class="photo" src="${x.photo_url}" alt="Foto do eSIM">`:'<div class="photo"></div>'}<div class="codes"><img src="${x.qr_url}" alt="QR Code de instalação do eSIM" style="display:block;width:190px;height:190px;background:white;padding:8px;border-radius:6px;margin-bottom:14px"><b>Endereço SM-DP+</b><br>${x.smdp}<br><br><b>Código de ativação</b><br>${x.activation_code}${x.line?`<br><br><b>ICCID / linha</b><br>${x.line}`:''}</div></div><div class="guide"><h3>${g.title}</h3><div class="steps">${g.steps.map((s,i)=>`<div class="step"><b>${i+1}. ${s.title}</b><span><strong>iPhone · iOS</strong><br>${s.iphone}</span><span><strong>Android</strong><br>${s.android}</span></div>`).join('')}</div><div class="notice"><b>Instalar o eSIM no aparelho</b><br><br><b>iPhone:</b> ${g.install.iphone}<br><br><b>Android:</b> ${g.install.android}<br><br>${g.install.note}</div></div></details></article>`}async function load(){let m=await(await fetch('/api/me')).json();if(!m.user)return;auth.style.display='none';dash.style.display='block';name.textContent='Olá, '+m.user.name;balance.textContent='Saldo: '+money(m.user.balance);let p=await(await fetch('/api/account/purchases')).json();count.textContent=p.purchases.length;list.innerHTML=p.purchases.length?p.purchases.map(render).join(''):'<p style="color:var(--muted)">Nenhuma compra aprovada. Adicione saldo na loja e escolha um plano.</p>'}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}load()</script><script src="/static/klicktech-3d.js" defer></script>
</body></html>
