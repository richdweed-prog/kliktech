<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} | KlikTech</title>
  <meta name="description" content="Página de erro da KlikTech.">
  <link rel="stylesheet" href="/static/css/minimal.css">
</head>
<body>
  <main class="minimal-shell">
    <a class="minimal-brand" href="/"><span class="minimal-mark" aria-hidden="true">K</span>KlikTech</a>
    <section class="minimal-card" aria-labelledby="error-title">
      <p class="minimal-code">ERRO {{ code }}</p>
      <h1 id="error-title">{{ title }}</h1>
      <p>{{ message }}</p>
      <a class="minimal-button" href="/">Voltar para a página inicial</a>
    </section>
  </main>
</body>
</html>
