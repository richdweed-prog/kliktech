services:
  - type: web
    name: kliktech-esim
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: KLIKTECH_COOKIE_SECURE
        value: "1"
      - key: KLIKTECH_TRUST_PROXY
        value: "0"
      - key: KLIKTECH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: KLIKTECH_ADMIN_EMAIL
        sync: false
      - key: KLIKTECH_ADMIN_PASSWORD
        sync: false
      - key: KLIKTECH_ADMIN_TOTP_SECRET
        sync: false
      - key: KLIKTECH_ADMIN_TOTP_ISSUER
        value: KlikTech
      - key: KLIKTECH_ADMIN_TOTP_SETUP_ENABLED
        value: "0"
      - key: KLIKTECH_ADMIN_PATH
        sync: false
      - key: KLIKTECH_PUBLIC_ORIGIN
        sync: false
      - key: KLIKTECH_CNPJ
        sync: false
      - key: BRAVOPAY_API_KEY
        sync: false
      - key: BRAVOPAY_WEBHOOK_SECRET
        sync: false
